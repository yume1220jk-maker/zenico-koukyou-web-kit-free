name: Refresh attributed, unverified procurement API candidates
on:
  schedule:
    - cron: "37 0 * * 1-5" # 09:37 JST, weekdays
  workflow_dispatch: {}
  push:
    paths:
      - "automation/zenico_recent_notices.py"
      - "automation/test_zenico_recent_notices.py"
      - ".github/workflows/refresh_public_notices.yml"
permissions:
  contents: write
concurrency:
  group: zenico-public-notices
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify XML filtering and non-fabrication behavior
        run: python automation/test_zenico_recent_notices.py
      - name: Fetch small official API sample, sequentially
        run: python automation/zenico_recent_notices.py
      - name: Publish candidate list against latest main without overwriting source edits
        run: |
          cp sample/recent-public-web-notices.md "$RUNNER_TEMP/zenico-sampled-notices.md"
          git fetch origin main
          git reset --hard origin/main
          cp "$RUNNER_TEMP/zenico-sampled-notices.md" sample/recent-public-web-notices.md
          git add sample/recent-public-web-notices.md
          if ! git diff --cached --quiet; then
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git config user.name 'github-actions[bot]'
            git commit -m 'data: refresh attributed API candidates (not verified open)'
            git push origin HEAD:main
          fi
