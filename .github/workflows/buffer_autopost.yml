name: ZENICO Buffer social publisher
on:
  schedule:
    - cron: '17 1 * * 1-5' # Weekdays 10:17 JST
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: zenico-buffer-social
  cancel-in-progress: false
jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ZENICO_BUFFER_API_KEY: ${{ secrets.ZENICO_BUFFER_API_KEY }}
      ZENICO_BUFFER_CHANNEL_ID: ${{ secrets.ZENICO_BUFFER_CHANNEL_ID }}
      ZENICO_BUFFER_EXPECTED_ACCOUNT: ${{ vars.ZENICO_BUFFER_EXPECTED_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Claim at most one approved original post
        run: python automation/buffer_autopost.py claim
      - name: Persist claim BEFORE calling external Buffer API
        run: |
          if ! git diff --quiet -- automation/buffer_post_state.json; then
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git config user.name 'github-actions[bot]'
            git add automation/buffer_post_state.json
            git commit -m 'chore: claim next original social post'
            git push
          fi
      - name: Queue the claimed post in Buffer
        run: python automation/buffer_autopost.py publish
      - name: Persist outcome
        run: |
          if ! git diff --quiet -- automation/buffer_post_state.json; then
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git config user.name 'github-actions[bot]'
            git add automation/buffer_post_state.json
            git commit -m 'chore: record Buffer post outcome'
            git push
          fi
